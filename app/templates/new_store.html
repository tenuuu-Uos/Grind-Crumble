{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <div class="border-b border-slate-200/80 pb-3 flex items-center justify-between">
        <div>
            <h1 class="text-lg font-bold text-slate-900 tracking-tight">Add New Store Location</h1>
            <p class="text-xs text-slate-500 mt-0.5">
                Register a new store into the chain network. Adds to store registry and initializes baseline monitoring.
            </p>
        </div>
        <a href="/" class="text-xs font-semibold text-slate-600 hover:text-slate-900 px-3 py-1.5 rounded-lg border border-slate-300 bg-white shadow-sm">
            &larr; Cancel
        </a>
    </div>

    {% if error %}
    <div class="p-3 rounded-lg bg-rose-50 text-rose-900 border border-rose-200 text-xs flex items-center space-x-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-600"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- New Store Form -->
    <form method="POST" action="/stores/new" class="bg-white rounded-lg border border-slate-200 p-6 space-y-4 shadow-sm">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Store ID -->
            <div>
                <label for="store_id" class="block text-xs font-semibold text-slate-700 mb-1">Store ID</label>
                <input type="text" name="store_id" id="store_id" value="{{ next_id }}" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs font-mono font-bold uppercase focus:outline-none focus:border-slate-900 bg-slate-50">
                <span class="text-[10px] text-slate-400">e.g. S13, S14</span>
            </div>

            <!-- Store Name -->
            <div>
                <label for="store_name" class="block text-xs font-semibold text-slate-700 mb-1">Store Name</label>
                <input type="text" name="store_name" id="store_name" placeholder="e.g. Liverpool Bold Street" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-slate-900">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- City -->
            <div>
                <label for="city" class="block text-xs font-semibold text-slate-700 mb-1">City</label>
                <input type="text" name="city" id="city" placeholder="e.g. Liverpool" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-slate-900">
            </div>

            <!-- Format -->
            <div>
                <label for="format" class="block text-xs font-semibold text-slate-700 mb-1">Format</label>
                <select name="format" id="format" class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs bg-white focus:outline-none focus:border-slate-900">
                    <option value="Standard" selected>Standard</option>
                    <option value="Flagship">Flagship</option>
                    <option value="Kiosk">Kiosk</option>
                </select>
            </div>

            <!-- Location Type -->
            <div>
                <label for="location_type" class="block text-xs font-semibold text-slate-700 mb-1">Location Type</label>
                <select name="location_type" id="location_type" class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs bg-white focus:outline-none focus:border-slate-900">
                    <option value="High street" selected>High street</option>
                    <option value="Transit">Transit</option>
                    <option value="Office district">Office district</option>
                    <option value="Tourist">Tourist</option>
                    <option value="Campus">Campus</option>
                    <option value="Affluent town">Affluent town</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-slate-100">
            <!-- Monthly Rent -->
            <div>
                <label for="monthly_rent_gbp" class="block text-xs font-semibold text-slate-700 mb-1">Monthly Rent (£)</label>
                <input type="number" step="100" name="monthly_rent_gbp" id="monthly_rent_gbp" value="7500" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-slate-900">
            </div>

            <!-- Manager Name -->
            <div>
                <label for="manager" class="block text-xs font-semibold text-slate-700 mb-1">Store Manager</label>
                <input type="text" name="manager" id="manager" placeholder="e.g. Alex Morgan" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-slate-900">
            </div>

            <!-- Target Monthly Sales -->
            <div>
                <label for="target_sales_gbp" class="block text-xs font-semibold text-slate-700 mb-1">Target Sales (£)</label>
                <input type="number" step="1000" name="target_sales_gbp" id="target_sales_gbp" value="60000" required
                       class="w-full px-3 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-slate-900">
            </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4 flex items-center justify-between">
            <span class="text-[11px] text-slate-400">Seeds starter financial records automatically</span>
            <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded transition flex items-center space-x-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>Create &amp; Add Store</span>
            </button>
        </div>

    </form>

</div>
{% endblock %}
